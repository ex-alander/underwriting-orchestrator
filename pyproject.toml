[project]
name = "underwriting-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator for credit underwriting"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # HTTP & parsing
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "reportlab>=4.2",
    # Validation & config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    # LLM & RAG
    "openai>=1.40",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.29",
    # Utils
    "python-dateutil>=2.9",
    "tenacity>=8.5",
    "pyyaml>=6.0",
    "faker>=40.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriting"]
